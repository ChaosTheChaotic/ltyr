[package]
name = "ltyr"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
imagesize = { version = "0.15.0", default-features = false, features = ["png"] }
kitty-graphics-protocol = "0.1.3"
little-kitty = "0.0.3"
owo-colors = "4.4.0"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
typst = "0.15.1"
typst-as-lib = { version = "0.17.0", features = ["typst-kit-embed-fonts", "typst-kit-fonts"] }
typst-layout = "0.15.1"
typst-render = "0.15.1"

[profile.release]
lto = true
codegen-units = 1
