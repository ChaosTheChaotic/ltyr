[package]
name = "ltyr"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
kitty-graphics-protocol = "0.1.3"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }

[profile.release]
lto = true
codegen-units = 1
